<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 李莉给您拜年啦</title>
    <style>
        :root {
            --fire-red: #d32f2f;
            --gold: #ffd700;
            --dark-red: #8b0000;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--dark-red);
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 背景烟花 */
        #fireworks {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* 贺卡主框 */
        .card {
            position: relative;
            z-index: 10;
            text-align: center;
            background: rgba(180, 0, 0, 0.9);
            padding: 40px 60px;
            border: 4px solid var(--gold);
            border-radius: 15px;
            box-shadow: 0 0 50px rgba(0,0,0,0.6);
            color: var(--gold);
            animation: cardEnter 1.5s ease-out;
            max-width: 90%;
        }

        /* 名字专属样式 */
        .name-tag {
            font-size: 2.2rem;
            margin-bottom: 10px;
            display: block;
            color: #fff;
            text-shadow: 0 0 10px var(--gold), 0 0 20px var(--gold);
            font-weight: bold;
            letter-spacing: 5px;
        }

        /* 新增：年份悬浮动画 */
        .year-display {
            font-size: 6rem;
            font-weight: 900;
            margin: 10px 0;
            background: linear-gradient(to bottom, #fff, var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 5px 5px rgba(0,0,0,0.3));
            display: block;
            animation: float 3s infinite ease-in-out; /* 悬浮效果 */
        }

        /* 新增：艺术字晃动动画 */
        h1 {
            font-size: 3.5rem;
            margin: 0;
            letter-spacing: 8px;
            display: inline-block;
            animation: textShake 2.5s infinite ease-in-out; /* 晃动效果 */
            transform-origin: center;
        }

        .blessing-text {
            font-size: 1.5rem;
            margin-top: 25px;
            line-height: 1.8;
            color: #ffe0b2;
        }

        .signature {
            margin-top: 30px;
            font-size: 1.2rem;
            font-style: italic;
            border-top: 1px solid rgba(255, 215, 0, 0.3);
            padding-top: 15px;
        }

        /* --- 动画定义区 --- */

        /* 贺卡入场 */
        @keyframes cardEnter {
            from { opacity: 0; transform: scale(0.8) rotate(-2deg); }
            to { opacity: 1; transform: scale(1) rotate(0deg); }
        }

        /* 左右晃动 */
        @keyframes textShake {
            0%, 100% { transform: rotate(-1deg) scale(1); }
            50% { transform: rotate(2deg) scale(1.05); }
        }

        /* 上下悬浮 */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        /* 底部流光 */
        .decoration {
            position: absolute;
            bottom: -10px;
            width: 100%;
            height: 20px;
            background: repeating-linear-gradient(45deg, var(--gold), var(--gold) 10px, transparent 10px, transparent 20px);
            opacity: 0.3;
        }
    </style>
</head>
<body>

<canvas id="fireworks"></canvas>

<div class="card">
    <span class="name-tag">李莉 恭贺</span>
    <h1>新春大吉</h1>
    <div class="year-display">2026</div>
    <div class="blessing-text">
        马到成功万事顺<br>
        龙马精神步步高<br>
        愿您在 2026 丙午年<br>
        如意吉祥，岁岁平安
    </div>
    <div class="signature">—— 2026.2.16 农历马年贺 ——</div>
    <div class="decoration"></div>
</div>

<script>
    const canvas = document.getElementById('fireworks');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    class FireworkParticle {
        constructor(x, y) {
            this.x = x;
            this.y = y;
            this.angle = Math.random() * Math.PI * 2;
            this.speed = Math.random() * 6 + 1;
            this.friction = 0.95;
            this.gravity = 0.1;
            this.hue = Math.random() * 50 + 10; // 偏向红色/黄色
            this.alpha = 1;
            this.decay = Math.random() * 0.02 + 0.01;
        }

        update() {
            this.speed *= this.friction;
            this.x += Math.cos(this.angle) * this.speed;
            this.y += Math.sin(this.angle) * this.speed + this.gravity;
            this.alpha -= this.decay;
        }

        draw() {
            ctx.save();
            ctx.globalAlpha = this.alpha;
            ctx.fillStyle = `hsla(${this.hue}, 100%, 50%, ${this.alpha})`;
            ctx.beginPath();
            ctx.arc(this.x, this.y, 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }
    }

    function createExplosion() {
        const x = Math.random() * canvas.width;
        const y = Math.random() * (canvas.height * 0.6);
        for (let i = 0; i < 60; i++) { // 稍微增加了烟花密度
            particles.push(new FireworkParticle(x, y));
        }
    }

    function loop() {
        // 拖尾效果
        ctx.fillStyle = 'rgba(139, 0, 0, 0.2)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        if (Math.random() < 0.06) createExplosion();

        particles = particles.filter(p => p.alpha > 0);
        particles.forEach(p => {
            p.update();
            p.draw();
        });

        requestAnimationFrame(loop);
    }

    loop();
</script>
</body>
</html>
